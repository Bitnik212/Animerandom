name: rec-engine

on:
  pull_request:
    paths:
      - "services/rec-engine/**"
      - "services/ingest-worker/contract/**"
      - ".github/workflows/rec-engine.yml"
  push:
    branches: [main]
    paths:
      - "services/rec-engine/**"
      - "services/ingest-worker/contract/**"
      - ".github/workflows/rec-engine.yml"

concurrency:
  group: rec-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/rec-engine
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      # The admin role: tests create their own database with pgvector.
      REC_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/rec-engine/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
