# One workflow for the whole repo. `changes` decides which service jobs run; `ci-ok`
# always runs and is the only required check, so PRs that touch no service can merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs: retargeting a PR (e.g. a stacked PR after its base merged) changes
  # nothing GitHub runs CI for. "Run workflow" on the PR branch attaches ci-ok to its head.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      ingest-worker: ${{ steps.filter.outputs.ingest-worker }}
      rec-engine: ${{ steps.filter.outputs.rec-engine }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ingest-worker:
              - "services/ingest-worker/**"
              - "infra/**"
              - ".github/workflows/ci.yml"
            rec-engine:
              - "services/rec-engine/**"
              - "services/ingest-worker/contract/**"
              - ".github/workflows/ci.yml"

  # Each service job: `needs: changes`, `if: needs.changes.outputs.<service> == 'true'`,
  # and listed in ci-ok's needs.

  ingest-worker:
    needs: changes
    if: needs.changes.outputs.ingest-worker == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ingest-worker
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only
      # The admin role: tests create their own database.
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/anime
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/ingest-worker/uv.lock
      - name: Install PostgreSQL 16 client (pg_dump for the contract test)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  rec-engine:
    needs: changes
    if: needs.changes.outputs.rec-engine == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/rec-engine
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      # The admin role: tests create their own database with pgvector.
      REC_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/rec-engine/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  ci-ok:
    if: always()
    needs: [changes, ingest-worker, rec-engine]
    runs-on: ubuntu-24.04
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
