# Reason texts for recommendations. {title} is the referenced anime in the user's locale.
reason.similar_to=Because you liked “{title}”
reason.liked_by_similar_users=People with similar taste loved this
reason.popular_in_genre=Popular in {genre}
reason.popular=Popular right now
# Counts shown by clients, formatted here so plural rules are right in every language.
count.anime={count, plural, one {# anime} other {# anime}}
