style:
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
  ForbiddenComment:
    active: false
complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInObjects: 25
  LongMethod:
    threshold: 80
performance:
  # Redis varargs (SADD, SINTERSTORE, …) take arrays; the copy is irrelevant at these sizes.
  SpreadOperator:
    active: false
exceptions:
  TooGenericExceptionCaught:
    active: false
