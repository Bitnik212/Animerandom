[project]
name = "rec-engine"
version = "0.1.0"
description = "Anime Picker recommendations: content embeddings + collaborative filtering"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.36",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "numpy>=2.0",
    "scipy>=1.14",
    "implicit>=0.7.2",
    "typer>=0.15",
    "threadpoolctl>=3.5",
]

[project.scripts]
rec = "rec_engine.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "scipy-stubs>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rec_engine"]

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = [
    "ignore:OpenBLAS is configured:RuntimeWarning",  # test-only reference fits
    "ignore:Using `httpx` with `starlette.testclient`",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
per-file-ignores = { "tests/*" = ["E501"] }  # table-driven cases read best on one line
ignore = [
    "RUF002",  # formulas in docstrings use × and − as written in the README
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["implicit.*", "pgvector.*", "sentence_transformers.*", "threadpoolctl"]
ignore_missing_imports = true
